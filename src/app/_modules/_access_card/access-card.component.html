<div class="border border-fb-gray-600 rounded-[5px] p-3 bg-white">
  <div class="flex items-start justify-between gap-3 flex-wrap">
    <div>
      <div class="text-sm font-bold">Zum Ausdrucken oder Weitergeben</div>
      @if (validity) {
        <div class="text-xs text-fb-gray-500 mt-0.5">{{ validity }}.</div>
      }
    </div>
    <fb-button size="small" (handleClick)="print()">Drucken</fb-button>
  </div>

  <div class="flex flex-wrap gap-4 mt-3">
    @for (entry of rendered; track entry.url) {
      <figure class="m-0 flex flex-col items-center w-36">
        @if (entry.qrDataUrl) {
          <img
            [src]="entry.qrDataUrl"
            [alt]="'QR-Code: ' + entry.label"
            class="w-32 h-32"
          />
        } @else {
          <div
            class="w-32 h-32 border border-dashed border-fb-gray-600"
            aria-hidden="true"
          ></div>
        }
        <figcaption class="text-xs text-center mt-1">
          {{ entry.label }}
        </figcaption>
      </figure>
    }
  </div>

  @if (printError) {
    <p class="text-sm text-red-700 mt-3">{{ printError }}</p>
  }
</div>
