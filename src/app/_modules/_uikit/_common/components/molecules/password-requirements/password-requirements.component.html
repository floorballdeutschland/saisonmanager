<div class="text-xs text-fb-gray-500">
  <div class="font-bold">
    {{ "passwordRequirements.title" | transloco }}
  </div>
  <ul class="mt-1 flex flex-col gap-0.5">
    @for (rule of rules; track rule.key) {
      <li
        class="flex items-start gap-1.5"
        [class.text-green-700]="rule.met"
        [class.text-fb-gray-400]="!rule.met && untouched"
        [class.text-orange-600]="!rule.met && !untouched"
      >
        <span aria-hidden="true">{{ rule.met ? "✓" : "○" }}</span>
        <span>{{
          "passwordRequirements." + rule.key
            | transloco: { minLength: minLength }
        }}</span>
      </li>
    }
  </ul>
</div>
