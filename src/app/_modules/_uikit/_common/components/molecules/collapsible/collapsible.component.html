<details [open]="open" (toggle)="onToggle($event)" class="group">
  <summary
    class="cursor-pointer select-none text-sm font-bold text-fb-gray-500 hover:text-black"
  >
    {{ label }}
    @if (count) {
      <span
        class="ml-1 inline-block min-w-5 rounded-full bg-fb-gray-200 px-1.5 text-center text-xs text-black"
        >{{ count }}</span
      >
    }
  </summary>
  <div class="mt-3">
    <ng-content />
  </div>
</details>
