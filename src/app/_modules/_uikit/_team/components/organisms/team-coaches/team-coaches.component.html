@if (coaches?.length) {
  <div class="mt-6">
    <fb-team-section-title
      title="Betreuer"
      [teamShortName]="teamShortName"
    ></fb-team-section-title>
    @for (coach of coaches; track coach.slot) {
      <div class="border-b border-fb-gray-200 text-sm py-2">
        {{ coach.name }}
      </div>
    }
  </div>
}
