<li class="flex">
  <div class="self-center">
    <!-- Ein Symbol je Status, Zuordnung in STATUS_ICONS. Der Klartext steht als
         Tooltip und Vorlesetext daran: Die Form unterscheidet die Status, den
         Namen nennt sie nicht.
         viewBox im 24er-Raster, in dem die Pfade gezeichnet sind. Die Vorlage
         stand bis hierher auf 22: Abgeschnitten war nichts (der Kreis endet
         mit Strichbreite bei 21,75), aber die Zeichnung saß neben der Mitte,
         weil ihr Mittelpunkt bei 12 liegt und der der Box bei 11. -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="1.5"
      stroke="currentColor"
      class="w-5 h-5 mr-2.5 mb-2"
      [ngClass]="statusIcon.colorClass"
      role="img"
    >
      <!-- Der Klartext als <title>-Kind, nicht als title-Attribut: Das Kind
           ist bei SVG der vorgesehene Weg und ist Tooltip und Vorlesetext in
           einem. Eine Bindung `[title]` am <svg> wies Angular hier
           nachgemessen ab (NG0303, "isn't a known property of 'svg'"). -->
      <title>{{ statusIcon.labelKey | transloco }}</title>
      @for (path of statusIcon.paths; track path) {
        <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="path" />
      }
    </svg>
  </div>
  <div class="grid gap-1">
    <!-- Ohne Namen bleibt die Kennung allein stehen: „(9664)" sagt weniger als
         der Name, aber mehr als das leere „ (9664)", das die Vorlage sonst
         setzte. -->
    <span class="font-bold text-[14px] leading-[12px]">
      @if (teamName) {
        {{
          "licenseAdmin.teamEntry.teamLabel"
            | transloco: { team: teamName, id: teamId }
        }}
      } @else {
        {{ "licenseAdmin.teamEntry.teamIdOnly" | transloco: { id: teamId } }}
      }
    </span>
    <span class="text-[12px]">{{ leagueName }}</span>
  </div>
</li>
