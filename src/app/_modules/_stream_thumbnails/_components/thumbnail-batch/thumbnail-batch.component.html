<div class="flex items-center gap-2">
  @if (busy) {
    <span class="text-xs text-fb-gray-400 whitespace-nowrap">
      {{ done }} von {{ total }}
    </span>
  }

  <button
    type="button"
    (click)="download()"
    [disabled]="busy"
    class="flex items-center font-bold text-black leading-[17px] text-sm px-3 py-2.5 border bg-white hover:bg-fb-gray-200 border-fb-gray-600 rounded-[5px] disabled:opacity-40"
    title="Livestream-Thumbnails aller Spiele dieses Spieltags als ZIP, 1280 × 720 Pixel, fertig zum Hochladen bei YouTube"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="1.5"
      stroke="currentColor"
      class="w-4 h-4 md:mr-2"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"
      />
    </svg>
    <span class="hidden md:inline">
      {{ busy ? "Thumbnails werden erzeugt …" : "Thumbnails" }}
    </span>
  </button>
</div>
