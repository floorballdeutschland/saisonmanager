<figure class="m-0">
  <svg
    class="block w-full h-auto"
    [attr.viewBox]="viewBox"
    [attr.data-field-size]="field.size"
    [attr.role]="hasLinked ? 'group' : 'img'"
    [attr.aria-label]="
      'match.detailedStats.chart.ariaLabel'
        | transloco: { team: teamName, count: shots.length }
    "
  >
    <!-- Bande, Mittellinie, Mittelpunkt, Bullypunkte -->
    <rect
      x="0"
      y="0"
      [attr.width]="field.length"
      [attr.height]="field.width"
      [attr.rx]="field.cornerRadius"
      fill="#f8fafc"
      stroke="#9ca3af"
      stroke-width="0.15"
    />
    <line
      [attr.x1]="markings.center.x"
      y1="0"
      [attr.x2]="markings.center.x"
      [attr.y2]="field.width"
      stroke="#d1d5db"
      stroke-width="0.12"
    />
    <circle
      [attr.cx]="markings.center.x"
      [attr.cy]="markings.center.y"
      r="0.25"
      fill="#9ca3af"
      data-testid="field-center"
    />
    @for (spot of markings.faceoffSpots; track $index) {
      <circle [attr.cx]="spot.x" [attr.cy]="spot.y" r="0.15" fill="#d1d5db" />
    }

    <!-- Torraum, Torhüterraum und Tor, links und rechts -->
    @for (area of markings.goalAreas; track $index) {
      <rect
        [attr.x]="area.x"
        [attr.y]="area.y"
        [attr.width]="area.width"
        [attr.height]="area.height"
        fill="none"
        stroke="#d1d5db"
        stroke-width="0.12"
        data-testid="field-goal-area"
      />
    }
    @for (area of markings.goalkeeperAreas; track $index) {
      <rect
        [attr.x]="area.x"
        [attr.y]="area.y"
        [attr.width]="area.width"
        [attr.height]="area.height"
        fill="none"
        stroke="#d1d5db"
        stroke-width="0.12"
      />
    }
    @for (goal of markings.goals; track $index) {
      <rect
        [attr.x]="goal.x"
        [attr.y]="goal.y"
        [attr.width]="goal.width"
        [attr.height]="goal.height"
        fill="#e5e7eb"
        stroke="#6b7280"
        stroke-width="0.1"
      />
    }

    @for (point of plotted; track $index) {
      <circle
        [attr.cx]="point.cx"
        [attr.cy]="point.cy"
        [attr.r]="(point.shot.result === 'goal' ? 0.65 : 0.5) * dotScale"
        [attr.fill]="colors[point.shot.result]"
        [attr.stroke]="point.shot.result === 'goal' ? '#14532d' : '#ffffff'"
        [attr.stroke-width]="
          (point.shot.result === 'goal' ? 0.15 : 0.1) * dotScale
        "
        [attr.data-result]="point.shot.result"
        [attr.data-linked]="point.linked || null"
        [attr.role]="point.linked ? 'button' : null"
        [attr.tabindex]="point.linked ? 0 : null"
        [attr.aria-label]="
          point.linked
            ? ('match.highlights.goalAria'
              | transloco: { time: point.shot.game_time })
            : null
        "
        [class.cursor-pointer]="point.linked"
        (click)="select(point)"
        (keydown.enter)="select(point)"
        (keydown.space)="$event.preventDefault(); select(point)"
      >
        <title>
          {{
            periodTitle(point.shot.period) ??
              ("match.detailedStats.periodN"
                | transloco: { n: point.shot.period })
          }}
          {{ point.shot.game_time }}:
          {{ "match.detailedStats.result." + point.shot.result | transloco }}
          {{ shooterLabel(point.shot) }}
        </title>
      </circle>
    }
  </svg>
  <figcaption
    class="flex items-center gap-1 mt-1 text-xs text-fb-gray-500"
    [class.justify-end]="attacksRight"
  >
    @if (!attacksRight) {
      <span aria-hidden="true">&larr;</span>
    }
    {{ "match.detailedStats.chart.direction" | transloco }}
    @if (attacksRight) {
      <span aria-hidden="true">&rarr;</span>
    }
  </figcaption>
</figure>
