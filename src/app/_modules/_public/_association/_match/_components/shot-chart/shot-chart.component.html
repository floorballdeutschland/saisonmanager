<figure class="m-0">
  <svg
    class="block w-full h-auto"
    [attr.viewBox]="viewBox"
    [attr.data-field-size]="field.size"
    role="img"
    [attr.aria-label]="
      'match.detailedStats.chart.ariaLabel'
        | transloco: { team: teamName, count: plotted.length }
    "
  >
    <g fbRinkMarkings [field]="field" [markings]="markings"></g>

    @for (point of plotted; track $index) {
      <!-- Strafschuss (Feedback #61): zusätzlicher Ring um den Punkt -->
      @if (point.shot.from_penalty_shot) {
        <circle
          [attr.cx]="point.cx"
          [attr.cy]="point.cy"
          [attr.r]="0.95 * dotScale"
          fill="none"
          stroke="#111827"
          [attr.stroke-width]="0.15 * dotScale"
          data-penalty-shot="true"
          aria-hidden="true"
        />
      }
      <circle
        [attr.cx]="point.cx"
        [attr.cy]="point.cy"
        [attr.r]="(point.shot.result === 'goal' ? 0.65 : 0.5) * dotScale"
        [attr.fill]="colors[point.shot.result]"
        [attr.stroke]="point.shot.result === 'goal' ? '#14532d' : '#ffffff'"
        [attr.stroke-width]="
          (point.shot.result === 'goal' ? 0.15 : 0.1) * dotScale
        "
        [attr.data-result]="point.shot.result"
      >
        <title>
          {{
            periodTitle(point.shot.period) ??
              ("match.detailedStats.periodN"
                | transloco: { n: point.shot.period })
          }}
          {{ point.shot.game_time }}:
          {{ "match.detailedStats.result." + point.shot.result | transloco }}
          {{ shooterLabel(point.shot) }}
          {{ situationLabel(point.shot) }}
        </title>
      </circle>
    }
  </svg>
  <figcaption
    class="flex items-center gap-1 mt-1 text-xs text-fb-gray-500"
    [class.justify-end]="attacksRight"
  >
    @if (!attacksRight) {
      <span aria-hidden="true">&larr;</span>
    }
    {{ "match.detailedStats.chart.direction" | transloco }}
    @if (attacksRight) {
      <span aria-hidden="true">&rarr;</span>
    }
  </figcaption>
</figure>
