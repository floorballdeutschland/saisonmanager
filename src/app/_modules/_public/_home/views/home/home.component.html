<div class="container mx-auto px-4 lg:px-8">
  <h1
    class="font-bold text-[32px] lg:text-[42px] font-bold pt-4 lg:pt-0 my-4 lg:my-8"
  >
    Saisonmanager
  </h1>

  <!-- „Heute live". Bewusst hier oben und nicht in der Seitenspalte: Wer
       nachsieht, was gerade laeuft, tut das jetzt und nicht nach zwei Klicks. -->
  <a
    [routerLink]="['/live']"
    class="inline-flex items-center gap-2 mb-6 font-bold text-black leading-[17px] text-sm px-5 py-2.5 border bg-white hover:bg-fb-gray-800 border-fb-gray-600 rounded-[5px]"
  >
    <span class="inline-block h-2 w-2 rounded-full bg-red-600"></span>
    Heute live
  </a>
</div>

<div class="bg-fb-gray-800 pt-4 lg:pt-8 pb-16">
  <div class="container mx-auto px-4 lg:px-8">
    <h2 class="font-bold text-xl lg:text-2xl">Spielbetriebe</h2>
    @if (associations$ | async; as associations) {
      <div
        class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-[25px] mt-4 lg:mt-9"
      >
        @for (association of associations; track association) {
          <fb-operation
            [full]="association.id === 1"
            [gameOperation]="association"
            [ngClass]="{
              'col-span-1 md:col-span-2 xl:col-span-3': association.id === 1,
            }"
          ></fb-operation>
        }
      </div>
    }
  </div>
</div>
