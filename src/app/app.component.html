@if (isStaging) {
  <div class="staging-ribbon" aria-hidden="true">
    <span class="staging-ribbon__text">Testsystem</span>
  </div>
}

@if (criticalDiskPercent$ | async; as diskPercent) {
  <div
    class="bg-red-700 text-white text-sm px-4 py-2 flex flex-wrap items-center justify-center gap-2 print:hidden"
    role="status"
  >
    <span>{{
      "systemHealth.bannerCritical" | transloco: { percent: diskPercent }
    }}</span>
    <a
      class="underline font-bold"
      [routerLink]="['/', 'verwaltung', 'system']"
      >{{ "systemHealth.bannerLink" | transloco }}</a
    >
  </div>
}

@if ((isLoading$ | async) === false) {
  <div
    class="lg:grid lg:grid-cols-[300px_1fr] min-h-screen print:lg:grid-cols-1"
  >
    <div class="lg:block h-full w-full print:lg:hidden">
      <fb-sidebar
        [association]="selectedAssociation$ | async"
        [stateAssociation]="selectedStateAssociation$ | async"
      >
        <fb-favorites-navigation
          [favorites]="(favoriteLeagues$ | async) ?? []"
          [favoriteTeams]="(favoriteTeams$ | async) ?? []"
          (removeFavorite)="removeFavoriteLeague($event)"
          (removeTeamFavorite)="removeFavoriteTeam($event)"
          class="hidden lg:block"
        ></fb-favorites-navigation>
        <fb-league-navigation
          [leagues]="(leagues$ | async) ?? []"
          [associations]="(associations$ | async) ?? []"
          [showAssociations]="(isHome$ | async) ?? false"
          [selectedAssociation]="selectedAssociation$ | async"
          [seasons]="(seasons$ | async) ?? []"
          [selectedSeasonId]="(selectedSeasonId$ | async) ?? null"
          (seasonChange)="onSeasonChange($event)"
          class="hidden lg:block"
        ></fb-league-navigation>
      </fb-sidebar>
    </div>
    <div
      class="h-full mt-[95px] lg:mt-0 lg:max-w-[calc(100vw-300px)] print:mt-0"
    >
      <div class="absolute flex justify-center items-center z-60">
        <fb-notification></fb-notification>
      </div>
      <router-outlet></router-outlet>
    </div>
  </div>
}
