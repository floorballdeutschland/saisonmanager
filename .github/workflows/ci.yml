name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Geheimnis-Suche über die GANZE Historie (deshalb fetch-depth: 0), in
      # Sekunden erledigt. Regeln und Ausnahmen: .gitleaks.toml und
      # .gitleaksignore. Das Binary wird mit fester Version und Prüfsumme
      # geladen; die offizielle gitleaks-action verlangt bei Organisations-
      # Repos einen Lizenzschlüssel.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose .

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npx ng lint

      # `ng lint` prüft nur `src/**` (siehe lintFilePatterns in angular.json), und
      # `overlay/` wird vom Build bloß als Asset kopiert. Ein Syntaxfehler dort kam
      # deshalb bisher durch die komplette CI und wäre erst in der Halle
      # aufgefallen — nachgestellt und bestätigt. Diese Dateien gehen live auf
      # Sendung und sind dort nicht reparierbar.
      #
      # Derselbe Schritt hält seit den Streaming-Grafiken auch die Wettbewerbe
      # zusammen: Farben und Bildmarken stehen in `overlay/overlay.css` und in
      # `competition-theme.ts`, die Übergangsgrafiken als Dateien daneben. Karma
      # liefert `overlay/` nicht aus, eine Abweichung bliebe sonst unsichtbar.
      - name: Overlay prüfen
        run: npm run check:overlay

      - name: Test
        run: npx ng test --no-watch --no-progress --browsers=ChromeHeadlessCI --code-coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Build
        run: npm run build
        # production build validates the entire app
