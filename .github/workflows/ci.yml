name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npx ng lint

      # `ng lint` prüft nur `src/**` (siehe lintFilePatterns in angular.json), und
      # `overlay/` wird vom Build bloß als Asset kopiert. Ein Syntaxfehler dort kam
      # deshalb bisher durch die komplette CI und wäre erst in der Halle
      # aufgefallen — nachgestellt und bestätigt. Diese Dateien gehen live auf
      # Sendung und sind dort nicht reparierbar.
      - name: Overlay-Syntax
        run: npm run check:overlay

      - name: Test
        run: npx ng test --no-watch --no-progress --browsers=ChromeHeadlessCI --code-coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Build
        run: npm run build
        # production build validates the entire app
